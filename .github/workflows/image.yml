name: Container-Image

# PR: nur bauen (prüft das Dockerfile). master: bauen und nach GHCR pushen,
# Tags = Commit-SHA (für deploy.ps1 und Rollback) + latest.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nullradix-dev/noose-website

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build-Nummer fortlaufend ab dem letzten Build vor der Container-Umstellung (1.0.1222),
      # sichtbar unter Einstellungen -> Status und im Changelog
      - id: ver
        run: echo "number=$((1222 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: BUILD_NUMBER=${{ steps.ver.outputs.number }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
