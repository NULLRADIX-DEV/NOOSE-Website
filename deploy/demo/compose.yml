services:
  db:
    image: mariadb:10.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=64M
    environment:
      TZ: Europe/Berlin
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD fehlt in .env}
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT fehlt in .env}:3306"
    labels:
      platform.backup: mariadb
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /run/mysqld
      - /tmp
    pids_limit: 256
    cpus: 1
    mem_limit: 384m
    memswap_limit: 384m
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ghcr.io/nullradix-dev/noose-website:${APP_COMMIT}
    env_file: app.env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ForwardedHeaders__KnownNetworks__0: ${APP_SUBNET}
    volumes:
      - ./data:/app/App_Data
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      db:
        condition: service_healthy
