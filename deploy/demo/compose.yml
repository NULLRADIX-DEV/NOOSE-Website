# NOOSE-Demo (demo.noose.info) als eigene App der gemeinsamen Server-Plattform: eigener Benutzer, eigener rootless Docker, eigene MariaDB.
# Ausgerollt per Workflow "Deploy" (Environment demo). Der Server setzt APP_COMMIT (Image-Tag), APP_PORT und
# APP_SUBNET. Demo__AutoSetup kommt aus app.env. Secrets liegen nur auf dem Server: .env fuer Compose, app.env fuer die App.
# Vor jedem Umschalten sichert der Server alle Datenbanken (Label platform.backup), denn ein Rollback macht
# Migrationen nicht rueckgaengig. Compose stoppt den alten Container, bevor der neue startet, es laufen also nie
# zwei Instanzen gleichzeitig (BackgroundServices).

services:
  db:
    image: mariadb:10.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=64M
    environment:
      TZ: Europe/Berlin
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD fehlt in .env}
    volumes:
      - ./db:/var/lib/mysql
    # Nur fuer die Verwaltung auf dem Server (1Panel); die App erreicht die DB ueber den Dienstnamen db.
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT fehlt in .env}:3306"
    labels:
      platform.backup: mariadb
    mem_limit: 384m
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ghcr.io/nullradix-dev/noose-website:${APP_COMMIT}
    env_file: app.env
    environment:
      ASPNETCORE_URLS: http://+:8080
      # nginx auf dem Host kommt ueber das Gateway dieses Netzes, ihm wird fuer X-Forwarded-* vertraut.
      ForwardedHeaders__KnownNetworks__0: ${APP_SUBNET}
    volumes:
      - ./data:/app/App_Data
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
